<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VíaClara · En vivo</title>
<style>
  :root { --bg:#0b0f14; --panel:#141a22; --borde:#253040; --texto:#e8eef5; --suave:#8b98a8; --rojo:#e5383b; --verde:#2fb344; --ambar:#f2b705; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.4 system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--borde); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } .demo { background:var(--ambar); color:#000; border-radius:4px; padding:2px 8px; font-size:12px; font-weight:700; }
  #estadoConexion { margin-left:auto; color:var(--suave); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; padding:16px; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
  .vista { background:#000; border-radius:10px; overflow:hidden; position:relative; aspect-ratio:9/16; max-height:78vh; margin:0 auto; width:100%; }
  @media (orientation:landscape) { .vista { aspect-ratio:16/9; } }
  .vista img { width:100%; height:100%; object-fit:contain; display:block; }
  .vista .vacio { position:absolute; inset:0; display:grid; place-items:center; color:var(--suave); text-align:center; padding:24px; }
  video, canvas { display:none; }
  .controles { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:8px; padding:10px 16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .semaforo button { min-width:110px; font-weight:800; font-size:18px; padding:14px 18px; }
  .semaforo .rojo.on { background:var(--rojo); border-color:var(--rojo); }
  .semaforo .verde.on { background:var(--verde); border-color:var(--verde); }
  label { color:var(--suave); font-size:13px; display:flex; gap:6px; align-items:center; }
  aside { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:12px; max-height:82vh; overflow:auto; }
  aside h2 { font-size:15px; margin:0 0 4px; } .resumen { color:var(--suave); font-size:13px; margin-bottom:10px; }
  .multa { display:grid; grid-template-columns:72px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--borde); }
  .multa img { width:72px; height:72px; object-fit:cover; border-radius:6px; background:#000; }
  .placa { font:700 20px/1 ui-monospace,Menlo,monospace; letter-spacing:1px; }
  .placa.nula { color:var(--suave); font-size:15px; }
  .meta { color:var(--suave); font-size:12px; margin-top:4px; }
  .chip { display:inline-block; border-radius:999px; padding:1px 8px; font-size:12px; margin-top:6px; border:1px solid var(--borde); }
  .chip.ok { border-color:var(--verde); color:var(--verde); } .chip.rev { border-color:var(--ambar); color:var(--ambar); } .chip.err { border-color:var(--rojo); color:var(--rojo); }
  .login { max-width:360px; margin:12vh auto; background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:20px; }
  .login input { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--borde); background:var(--bg); color:var(--texto); margin:6px 0 12px; }
</style>
</head>
<body>
<header>
  <h1>VíaClara · Cámara en vivo</h1><span class="demo">DEMO</span>
  <span id="estadoConexion">Desconectado</span>
</header>

<section class="login" id="login">
  <h2 style="margin-top:0">Conectar cámara</h2>
  <label for="clave">Clave de cámara</label>
  <input id="clave" type="password" autocomplete="off">
  <label for="camara">Código de cámara</label>
  <input id="camara" value="CAM-001">
  <button id="entrar" style="width:100%">Abrir cámara</button>
  <p class="meta">La cámara del navegador solo funciona con HTTPS (ngrok) o en localhost.</p>
</section>

<main id="app" hidden>
  <div>
    <div class="vista"><img id="salida" alt="Vista anotada por el modelo"><div class="vacio" id="vacio">Esperando cámara…</div></div>
    <div class="controles semaforo">
      <button class="rojo" data-estado="rojo">ROJO</button>
      <button class="verde on" data-estado="verde">VERDE</button>
    </div>
    <div class="controles">
      <label>Línea de pare <input id="linea" type="range" min="0.1" max="0.9" step="0.02" value="0.6"></label>
      <label><input id="haciaCamara" type="checkbox"> los carros vienen hacia la cámara</label>
      <span class="meta" id="fps"></span>
    </div>
  </div>
  <aside>
    <h2>Multas en vivo</h2>
    <div class="resumen" id="resumen">Solo multa a quien cruza la línea con el semáforo en ROJO.</div>
    <div id="lista"></div>
  </aside>
</main>

<video id="video" playsinline muted></video>
<canvas id="lienzo"></canvas>

<script>
const $ = (id) => document.getElementById(id);
const ANCHO_ENVIO = 1280; // el motor lee la placa del recorte: no bajar mucho la resolución
let ws, enVuelo = false, total = 0, ultimo = performance.now(), cuadros = 0, errorServidor = '';
const tarjetas = new Map();

try { $('clave').value = localStorage.getItem('vc_clave') || ''; $('camara').value = localStorage.getItem('vc_camara') || 'CAM-001'; } catch {}

$('entrar').onclick = async () => {
  const clave = $('clave').value.trim(), camara = $('camara').value.trim() || 'CAM-001';
  try { localStorage.setItem('vc_clave', clave); localStorage.setItem('vc_camara', camara); } catch {}
  $('login').hidden = true; $('app').hidden = false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    $('video').srcObject = stream; await $('video').play();
  } catch (e) { $('vacio').textContent = 'No se pudo abrir la cámara: ' + e.message; return; }
  conectar(clave, camara);
};

function conectar(clave, camara) {
  const url = location.origin.replace(/^http/, 'ws') + '/en-vivo/ws';
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ tipo: 'auth', clave, camara }));
  ws.onclose = () => { $('estadoConexion').textContent = (errorServidor || 'Desconectado') + ' — recarga para reconectar'; };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.tipo === 'error') { errorServidor = m.mensaje; $('estadoConexion').textContent = m.mensaje; return; }
    if (m.tipo === 'listo') { $('estadoConexion').textContent = 'Conectado · ' + m.modelVersion; enviarLinea(); enviarCuadro(); return; }
    if (m.tipo === 'cuadro') {
      enVuelo = false;
      if (m.jpg) { $('salida').src = 'data:image/jpeg;base64,' + m.jpg; $('vacio').hidden = true; }
      m.multas.forEach(agregarMulta);
      m.registros.forEach(actualizarRegistro);
      cuadros++; const ahora = performance.now();
      if (ahora - ultimo > 1000) { $('fps').textContent = (cuadros * 1000 / (ahora - ultimo)).toFixed(1) + ' cuadros/s'; cuadros = 0; ultimo = ahora; }
      enviarCuadro();
    }
  };
}

// Un cuadro a la vez: el siguiente sale cuando vuelve la respuesta (el ritmo se adapta al modelo).
function enviarCuadro() {
  const v = $('video');
  if (!ws || ws.readyState !== 1 || enVuelo || !v.videoWidth) { setTimeout(enviarCuadro, 50); return; }
  const escala = Math.min(1, ANCHO_ENVIO / Math.max(v.videoWidth, v.videoHeight));
  const c = $('lienzo'); c.width = Math.round(v.videoWidth * escala); c.height = Math.round(v.videoHeight * escala);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  enVuelo = true;
  c.toBlob((b) => { if (b) ws.send(b); else enVuelo = false; }, 'image/jpeg', 0.8);
}

document.querySelectorAll('.semaforo button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.semaforo button').forEach((x) => x.classList.toggle('on', x === b));
  ws?.send(JSON.stringify({ tipo: 'semaforo', estado: b.dataset.estado }));
});
const enviarLinea = () => ws?.readyState === 1 && ws.send(JSON.stringify({ tipo: 'linea', y: Number($('linea').value), haciaCamara: $('haciaCamara').checked }));
$('linea').onchange = enviarLinea; $('haciaCamara').onchange = enviarLinea;

function agregarMulta(m) {
  total++;
  $('resumen').textContent = total + (total === 1 ? ' multa' : ' multas') + ' en esta sesión';
  const el = document.createElement('div'); el.className = 'multa';
  const foto = m.fotoPlaca || m.fotoVehiculo;
  el.innerHTML = `<img alt="Vehículo multado"><div><div class="placa"></div><div class="meta"></div><span class="chip">Registrando…</span></div>`;
  if (foto) el.querySelector('img').src = 'data:image/jpeg;base64,' + foto;
  const p = el.querySelector('.placa');
  p.textContent = m.placa || 'Placa no leída'; p.classList.toggle('nula', !m.placa);
  el.querySelector('.meta').textContent = `${new Date(m.hora).toLocaleTimeString('es-VE', { timeZone: 'America/Caracas' })} · ${m.clase} · confianza ${(m.confianza * 100).toFixed(0)}% · ${m.votos} lecturas`;
  $('lista').prepend(el); tarjetas.set(m.ref, el);
}

function actualizarRegistro(r) {
  const chip = tarjetas.get(r.ref)?.querySelector('.chip'); if (!chip) return;
  if (!r.ok) { chip.className = 'chip err'; chip.textContent = 'Sin registrar: ' + r.error; return; }
  const revision = r.status === 'NEEDS_REVIEW';
  chip.className = 'chip ' + (revision ? 'rev' : 'ok');
  chip.textContent = revision ? 'A revisión humana' : (r.fineId ? 'Multa emitida' : 'Registrada');
}
</script>
</body>
</html>
